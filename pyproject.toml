[project]
name = "gemelo-cali"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude/skills/webapp-testing"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (training, full episodes)"]
addopts = "-ra -p no:cacheprovider"
