name: gemelo-cali

x-user: &user "${UID:-1000}:${GID:-1000}"

services:
  sim-api:
    user: *user
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # trainer image: the live panel also runs the trained PPO policy (torch + SB3)
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: gemelo-cali/trainer:dev
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --limit-concurrency
      - "128"
      - --ws-max-size
      - "4096"
      - --ws-max-queue
      - "2"
      - --no-access-log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    ports: ["127.0.0.1:${DEMO_PORT:-8000}:8000"]
    volumes:
      - ./scenarios:/app/scenarios
      - ./models:/app/models:ro
      - ./outputs:/app/outputs
      - ./sim:/app/sim:ro
      - ./api:/app/api:ro
      - ./rl:/app/rl:ro
      - ./eval:/app/eval:ro
      - ./tests:/app/tests:ro
      - ./web:/app/web:ro
      - ./config:/app/config:ro
      - ./secrets:/app/secrets
      - ./pyproject.toml:/app/pyproject.toml:ro
    environment:
      SCENARIO: ${SCENARIO:-}
      # LLM assistant: values come from the project's env file (see env.example); the key is
      # never logged, traced or returned by the API
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PLAN: ${LLM_PLAN:-free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DAILY_USD: ${LLM_DAILY_USD:-1}
      LLM_DAILY_TOKENS: ${LLM_DAILY_TOKENS:-200000}
      DEMO_ACCESS: ${DEMO_ACCESS:-local}
      DEMO_ORIGIN: ${DEMO_ORIGIN:-}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_FAULTS: ${DEMO_FAULTS:-0}
    restart: unless-stopped

  # optional: the panel is served by sim-api on :8000; nginx on :8080 only with --profile nginx
  web:
    profiles: ["nginx"]
    image: nginx:alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sim-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trainer:
    user: *user
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    volumes:
      - ./models:/app/models
      - ./scenarios:/app/scenarios
      - ./outputs:/app/outputs
      - ./sim:/app/sim:ro
      - ./api:/app/api:ro
      - ./rl:/app/rl:ro
      - ./eval:/app/eval:ro
      - ./tests:/app/tests:ro
      - ./web:/app/web:ro
      - ./config:/app/config:ro
      - ./pyproject.toml:/app/pyproject.toml:ro

  tensorboard:
    user: *user
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    command: ["tensorboard", "--logdir", "/app/outputs/tb", "--host", "0.0.0.0", "--port", "6006"]
    ports: ["127.0.0.1:6006:6006"]
    volumes:
      - ./outputs/tb:/app/outputs/tb:ro

  # Optional public tunnel for remote viewers. Confirm with the team before enabling.
  # tunnel:
  #   image: cloudflare/cloudflared:2025.10.0
  #   command: tunnel --no-autoupdate --url http://web:80
  #   depends_on: [web]
