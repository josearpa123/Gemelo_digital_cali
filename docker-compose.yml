name: gemelo-cali

x-user: &user "${UID:-1000}:${GID:-1000}"

x-volumes: &volumes
  - ./scenarios:/app/scenarios
  - ./models:/app/models
  - ./outputs:/app/outputs
  # source code mounted read-only so tests and the API always see the working tree
  - ./sim:/app/sim:ro
  - ./api:/app/api:ro
  - ./rl:/app/rl:ro
  - ./eval:/app/eval:ro
  - ./tests:/app/tests:ro
  - ./web:/app/web:ro
  - ./config:/app/config:ro
  # LLM key typed in the panel (mode 600, ignored by git)
  - ./secrets:/app/secrets
  - ./pyproject.toml:/app/pyproject.toml:ro

services:
  sim-api:
    user: *user
    # trainer image: the live panel also runs the trained PPO policy (torch + SB3)
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: gemelo-cali/trainer:dev
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    ports: ["8000:8000"]
    volumes: *volumes
    environment:
      SCENARIO: ${SCENARIO:-}
      # LLM assistant: values come from the project's env file (see env.example); the key is
      # never logged, traced or returned by the API
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PLAN: ${LLM_PLAN:-free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

  # optional: the panel is served by sim-api on :8000; nginx on :8080 only with --profile nginx
  web:
    profiles: ["nginx"]
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sim-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trainer:
    user: *user
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    volumes: *volumes

  tensorboard:
    user: *user
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    command: ["tensorboard", "--logdir", "/app/outputs/tb", "--host", "0.0.0.0", "--port", "6006"]
    ports: ["6006:6006"]
    volumes: *volumes

  # Optional public tunnel for remote viewers. Confirm with the team before enabling.
  # tunnel:
  #   image: cloudflare/cloudflared:2025.10.0
  #   command: tunnel --no-autoupdate --url http://web:80
  #   depends_on: [web]
