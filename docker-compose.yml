name: gemelo-cali

x-user: &user "${UID:-1000}:${GID:-1000}"

x-volumes: &volumes
  - ./scenarios:/app/scenarios
  - ./models:/app/models
  - ./outputs:/app/outputs
  # source code mounted read-only so tests and the API always see the working tree
  - ./sim:/app/sim:ro
  - ./api:/app/api:ro
  - ./tests:/app/tests:ro
  - ./pyproject.toml:/app/pyproject.toml:ro

services:
  sim-api:
    user: *user
    build: { context: ., dockerfile: docker/Dockerfile, target: sim }
    image: gemelo-cali/sim:dev
    ports: ["8000:8000"]
    volumes: *volumes
    environment:
      SCENARIO: ${SCENARIO:-}
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sim-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trainer:
    user: *user
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    volumes: *volumes

  tensorboard:
    user: *user
    image: gemelo-cali/trainer:dev
    profiles: ["train"]
    command: ["tensorboard", "--logdir", "/app/outputs/tb", "--host", "0.0.0.0", "--port", "6006"]
    ports: ["6006:6006"]
    volumes: *volumes

  # Optional public tunnel for remote viewers. Confirm with the team before enabling.
  # tunnel:
  #   image: cloudflare/cloudflared:2025.10.0
  #   command: tunnel --no-autoupdate --url http://web:80
  #   depends_on: [web]
